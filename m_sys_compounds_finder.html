<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-sys Chemical Compound & BIP Finder</title>

    <!-- ★ msys_data 폴더의 순수 물질 및 BIP 데이터 파일 연결 -->
    <script src="msys_data/compounds.js"></script>
    <script src="msys_data/eos_bip.js"></script>

    <style>
        :root {
            --bg-color: #121824;
            --card-bg: #1e293b;
            --card-border: #334155;
            --primary: #38bdf8;
            --primary-hover: #0ea5e9;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #10b981;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 30px 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 980px; }
        header { margin-bottom: 25px; text-align: center; }
        header h1 { font-size: 26px; color: var(--primary); margin-bottom: 8px; }
        header p { color: var(--text-sub); font-size: 14px; }

        .card { background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 24px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); margin-bottom: 25px; }
        .search-box { display: flex; gap: 12px; margin-bottom: 16px; }
        .search-box input { flex: 1; padding: 14px 18px; background-color: #0f172a; border: 1px solid var(--card-border); border-radius: 8px; color: var(--text-main); font-size: 16px; outline: none; }
        .search-box input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2); }
        .search-box button { padding: 0 28px; background-color: var(--primary); color: #0f172a; font-weight: 700; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; }
        .search-box button:hover { background-color: var(--primary-hover); }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-sub);
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 14px;
        }

        /* 💡 힐 시스템(Hill System) 표기 규칙 안내 박스 */
        .hill-system-notice {
            margin-top: 14px;
            padding: 10px 14px;
            background-color: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-left: 3px solid var(--primary);
            border-radius: 6px;
            font-size: 12.5px;
            line-height: 1.6;
            color: #cbd5e1;
        }
        .hill-system-notice strong {
            color: var(--primary);
        }

        .summary-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 10px 14px;
            background-color: #1e293b;
            border-radius: 8px;
            font-size: 14px;
            color: var(--text-sub);
            border: 1px solid var(--card-border);
        }
        .summary-bar strong { color: var(--primary); }

        #result-area { display: block; }
        .result-card { background-color: #0f172a; border: 1px solid var(--card-border); border-radius: 8px; padding: 20px; margin-bottom: 16px; animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        .result-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border); padding-bottom: 12px; margin-bottom: 16px; }
        .comp-title { font-size: 20px; font-weight: 700; color: var(--primary); }
        
        .prop-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 16px; }
        .prop-item { background-color: #1e293b; padding: 12px 14px; border-radius: 6px; border-left: 3px solid var(--primary); }
        .prop-label { font-size: 12px; color: var(--text-sub); margin-bottom: 4px; }
        .prop-value { font-size: 16px; font-weight: 600; color: var(--text-main); }
        
        .copy-btn { 
            background-color: var(--accent); 
            color: #0f172a; 
            border: none; 
            padding: 8px 14px; 
            border-radius: 6px; 
            font-size: 13px; 
            font-weight: 700; 
            cursor: pointer; 
            transition: all 0.2s ease;
        }
        .copy-btn.copied {
            background-color: #38bdf8;
            color: #0f172a;
        }

        /* BIP Table */
        .bip-section { margin-top: 16px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 14px; }
        .bip-title { font-size: 14px; font-weight: 600; color: var(--accent); margin-bottom: 10px; }
        .bip-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .bip-table th, .bip-table td { padding: 9px 12px; border: 1px solid var(--card-border); text-align: left; }
        .bip-table th { background-color: #1e293b; color: var(--text-sub); font-weight: 600; }
        .bip-table tr:hover { background-color: rgba(56, 189, 248, 0.05); }

        .not-found { text-align: center; padding: 40px 20px; color: var(--danger); font-size: 16px; font-weight: 600; background-color: #0f172a; border: 1px dashed var(--danger); border-radius: 8px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🔬 M-sys Chemical & BIP Finder</h1>
        <p>순수 성분 물성(Tc, Pc, MW) 및 이성분 상호작용 파라미터(k_ij) 자동 검색기</p>
    </header>

    <div class="card">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="검색어 입력 (엔터 또는 빈칸 검색 시 전체 목록 출력)..." autofocus>
            <button onclick="searchCompound()">확인 (검색)</button>
        </div>

        <div class="status-bar">
            <span id="db-status">⏳ msys_data 데이터 로딩 중...</span>
            <span style="font-size: 13px; color: #94a3b8;">(검색어: 화학식, 이름, CAS 번호)</span>
        </div>

        <!-- 💡 힐 시스템(Hill System) 규칙 안내 문구 -->
        <div class="hill-system-notice">
            📌 <strong>화학식 표기방법 :</strong> '힐 시스템(Hill System)'이라는 국제적인 화학식 표기 규칙을 따름. 표기방법은 탄소(C)가 있으면 C를 먼저, 그다음은 수소(H)를 나타내고, 그 외의 원소는 알파벳 순서로 차례대로 나열합니다. (단, 탄소가 없는 화합물은 모든 원소를 알파벳 순서로만 나열합니다.)
        </div>
    </div>

    <div id="result-area"></div>
</div>

<script>
    let compoundsDB = [];
    let bipDB = [];

    // ─────────────────────────────────────────────────────────────
    // ★ [핵심 패치] 따옴표 안의 쉼표를 완벽히 보존하는 표준 CSV 분리기
    // ─────────────────────────────────────────────────────────────
    function parseCSVLine(line) {
        const result = [];
        let cur = '';
        let inQuotes = false;

        for (let i = 0; i < line.length; i++) {
            const char = line[i];
            if (char === '"') {
                inQuotes = !inQuotes;
            } else if (char === ',' && !inQuotes) {
                result.push(cur.trim().replace(/^["']|["']$/g, ''));
                cur = '';
            } else {
                cur += char;
            }
        }
        result.push(cur.trim().replace(/^["']|["']$/g, ''));
        return result;
    }

    // ─────────────────────────────────────────────────────────────
    // ★ msys_data/compounds.js 및 msys_data/eos_bip.js 파싱
    // ─────────────────────────────────────────────────────────────
    function initDataFromExternalJS() {
        let compoundsLoaded = false;
        let bipLoaded = false;

        // 1. 순수 화합물 데이터 (msys_data/compounds.js)
        if (typeof PURE_COMPOUNDS_CSV !== 'undefined') {
            compoundsDB = parseCompoundsCSV(PURE_COMPOUNDS_CSV);
            compoundsLoaded = true;
        } else if (typeof PURE_COMPOUNDS_DB !== 'undefined') {
            compoundsDB = PURE_COMPOUNDS_DB;
            compoundsLoaded = true;
        }

        // 2. 이성분 상호작용 파라미터 데이터 (msys_data/eos_bip.js)
        if (typeof EOS_BIP_CSV !== 'undefined') {
            bipDB = parseBIPCSV(EOS_BIP_CSV);
            bipLoaded = true;
        } else if (typeof EOS_BIP_DB !== 'undefined') {
            bipDB = EOS_BIP_DB;
            bipLoaded = true;
        }

        const statusEl = document.getElementById("db-status");
        if (compoundsLoaded) {
            let msg = `✅ 순수 성분 (${compoundsDB.length}종) 자동 로드 완료`;
            if (bipLoaded) msg += ` + 이성분 파라미터 (${bipDB.length}쌍) 연동됨`;
            statusEl.innerText = msg;
            statusEl.style.color = "#10b981";
        } else {
            statusEl.innerText = `⚠️ msys_data/compounds.js 파일을 찾지 못했습니다. 경로를 확인해 주세요.`;
            statusEl.style.color = "#ef4444";
        }

        // 전체 목록 자동 렌더링
        searchCompound();
    }

    function parseCompoundsCSV(csvText) {
        const lines = csvText.trim().split("\n");
        if (lines.length < 2) return [];

        const headerCols = parseCSVLine(lines[0]).map(c => c.toLowerCase());
        let idxName = headerCols.findIndex(c => c.includes("name") || c.includes("compound"));
        let idxFormula = headerCols.findIndex(c => c.includes("formula"));
        let idxCAS = headerCols.findIndex(c => c.includes("cas"));
        let idxMW = headerCols.findIndex(c => c === "mw" || c.includes("weight") || c.includes("molar"));
        let idxTc = headerCols.findIndex(c => c === "tc" || c.includes("tcrit"));
        let idxPc = headerCols.findIndex(c => c === "pc" || c.includes("pcrit"));
        let idxOmega = headerCols.findIndex(c => c.includes("omega") || c.includes("acentric"));

        if (idxName === -1) idxName = 0;
        if (idxFormula === -1) idxFormula = 1;
        if (idxCAS === -1) idxCAS = 2;
        if (idxMW === -1) idxMW = 3;
        if (idxTc === -1) idxTc = 4;
        if (idxPc === -1) idxPc = 5;
        if (idxOmega === -1) idxOmega = 7; // pure_compounds.csv 표준: 6은 Vc, 7이 omega

        let db = [];
        for (let i = 1; i < lines.length; i++) {
            const line = lines[i].trim();
            if (!line) continue;
            
            // 💡 표준 CSV 분리기 호출로 쉼표 포함 이름 완벽 보호
            const cols = parseCSVLine(line);
            if (cols.length >= 4) {
                let nameVal = cols[idxName] || "";
                let formulaVal = cols[idxFormula] || "";
                let casVal = cols[idxCAS] || "";

                // CAS와 화학식 형태 자동 감지 및 위치 교정 (순서 뒤바뀜 안전망)
                const isCasLike = (str) => /^\d{2,7}-\d{2}-\d$/.test(str);
                if (isCasLike(formulaVal) && !isCasLike(casVal)) {
                    let tmp = formulaVal; formulaVal = casVal; casVal = tmp;
                }

                let mwVal = parseFloat(cols[idxMW]) || 0;
                let tcVal = parseFloat(cols[idxTc]) || 0;
                let pcVal = parseFloat(cols[idxPc]) || 0;
                if (pcVal > 1e4) pcVal = pcVal / 1e5; // Pa -> bar
                let omegaVal = parseFloat(cols[idxOmega]) || 0;

                db.push({
                    Name: nameVal, Formula: formulaVal, CAS: casVal,
                    MW: mwVal, Tc: tcVal, Pc: pcVal, Omega: omegaVal, Aliases: []
                });
            }
        }
        return db;
    }

    function parseBIPCSV(csvText) {
        const lines = csvText.trim().split("\n");
        let bips = [];
        for (let i = 1; i < lines.length; i++) {
            const line = lines[i].trim();
            if (!line) continue;
            const cols = parseCSVLine(line);
            if (cols.length >= 3) {
                bips.push({
                    c1: cols[0].trim().toUpperCase(),
                    c2: cols[1].trim().toUpperCase(),
                    kij: parseFloat(cols[2]) || 0.0
                });
            }
        }
        return bips;
    }

    document.getElementById("search-input").addEventListener("keypress", (e) => { if (e.key === "Enter") searchCompound(); });

    // ─────────────────────────────────────────────────────────────
    // 검색 및 일체형 카드 렌더링
    // ─────────────────────────────────────────────────────────────
    function searchCompound() {
        const rawQuery = document.getElementById("search-input").value.trim().toLowerCase();
        const query = rawQuery.replace(/[\s\-_]/g, ""); // 공백, 하이픈 제거 정규화
        const resultArea = document.getElementById("result-area");
        resultArea.innerHTML = "";

        let matched = [];
        let summaryText = "";

        if (!rawQuery) {
            matched = compoundsDB;
            summaryText = `📋 <strong>전체 등록 물질 목록</strong> (총 <strong>${matched.length}</strong>종) | 순수 물성과 이성분 상호작용 파라미터(BIP)가 함께 표시됩니다.`;
        } else {
            matched = compoundsDB.filter(c => {
                const cleanName = (c.Name || "").toLowerCase().replace(/[\s\-_]/g, "");
                const cleanForm = (c.Formula || "").toLowerCase().replace(/[\s\-_]/g, "");
                const cleanCAS  = (c.CAS || "").toLowerCase().replace(/[\s\-_]/g, "");
                
                // 화학식 검색 시 C4H8 등 분자식 정확 일치 우선 및 이름/CAS 부분일치 지원
                return cleanName.includes(query) || cleanForm === query || cleanCAS.includes(query);
            });
            summaryText = `🔍 <strong>"${rawQuery}"</strong> 검색 결과: 총 <strong>${matched.length}</strong>개 일치`;
        }

        if (matched.length === 0) {
            resultArea.innerHTML = `
                <div class="not-found">
                    🚫 일치하는 물질이 없습니다: "${rawQuery}"
                    <p style="margin-top:8px; font-size:13px; color:#94a3b8; font-weight:normal;">
                    msys_data/compounds.js 파일에 해당 물질을 추가하시거나 검색어 철자를 다시 확인해 주세요.</p>
                </div>`;
            return;
        }

        const summaryBar = document.createElement("div");
        summaryBar.className = "summary-bar";
        summaryBar.innerHTML = summaryText;
        resultArea.appendChild(summaryBar);

        matched.forEach(c => {
            const tempC = (c.Tc - 273.15).toFixed(2);
            const upperName = c.Name.toUpperCase();
            const normName = upperName.replace(/[\s\-_]/g, "");
            
            // 이 물질과 연결된 이성분 상호작용(BIP: k_ij) 조회 (공백/하이픈 유연 매칭)
            const relatedBIP = bipDB.filter(b => {
                const b1 = b.c1.replace(/[\s\-_]/g, "");
                const b2 = b.c2.replace(/[\s\-_]/g, "");
                return b1 === normName || b2 === normName || b.c1 === upperName || b.c2 === upperName;
            });

            let bipHTML = "";
            if (relatedBIP.length > 0) {
                bipHTML = `
                    <div class="bip-section">
                        <div class="bip-title">🔗 등록된 이성분 상호작용 매개변수 (BIP: k_ij) — 총 ${relatedBIP.length}개 연동됨</div>
                        <table class="bip-table">
                            <tr><th>혼합 상대 물질 (Component 2)</th><th>상호작용 계수 (k_ij)</th><th>적용 모델</th></tr>
                            ${relatedBIP.map(b => {
                                const b1 = b.c1.replace(/[\s\-_]/g, "");
                                const partner = (b1 === normName || b.c1 === upperName) ? b.c2 : b.c1;
                                return `<tr><td><strong>${partner}</strong></td><td style="color:#38bdf8; font-weight:700;">${b.kij.toFixed(4)}</td><td>PR / SRK EOS</td></tr>`;
                            }).join("")}
                        </table>
                    </div>`;
            } else {
                bipHTML = `
                    <div class="bip-section" style="font-size:12px; color:#64748b;">
                        ℹ️ 등록된 고유 BIP 없음 (혼합물 계산 시 화학공학 표준 기본값 k_ij = 0.0000 자동 적용)
                    </div>`;
            }

            const formulaDisplay = c.Formula ? `<span style="color: #38bdf8; font-size: 15px; margin-left: 6px;">(${c.Formula})</span>` : "";
            const casDisplay = c.CAS ? `<span style="color:#94a3b8; font-size:13px;">CAS: ${c.CAS}</span>` : `<span style="color:#94a3b8; font-size:13px;">CAS: -</span>`;

            const card = document.createElement("div");
            card.className = "result-card";
            card.innerHTML = `
                <div class="result-header">
                    <div>
                        <span class="comp-title">${c.Name}</span> 
                        ${formulaDisplay}
                    </div>
                    <div>
                        ${casDisplay}
                        <button class="copy-btn" onclick="copyFluidID('${c.Name}', this)" style="margin-left: 12px;">Fluid ID 복사</button>
                    </div>
                </div>
                <div class="prop-grid">
                    <div class="prop-item"><div class="prop-label">분자량 (MW)</div><div class="prop-value">${c.MW.toFixed(3)} g/mol</div></div>
                    <div class="prop-item"><div class="prop-label">임계온도 (Tc)</div><div class="prop-value">${c.Tc.toFixed(2)} K (${tempC} ℃)</div></div>
                    <div class="prop-item"><div class="prop-label">임계압력 (Pc)</div><div class="prop-value">${c.Pc.toFixed(2)} bar</div></div>
                    <div class="prop-item"><div class="prop-label">이심인자 (ω)</div><div class="prop-value">${c.Omega.toFixed(4)}</div></div>
                </div>
                ${bipHTML}
            `;
            resultArea.appendChild(card);
        });
    }

    // 로컬 file:// 환경 100% 호환 클립보드 복사 함수
    function copyFluidID(text, btnElement) {
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).then(() => {
                showCopySuccess(btnElement);
            }).catch(() => {
                fallbackCopy(text, btnElement);
            });
        } else {
            fallbackCopy(text, btnElement);
        }
    }

    function fallbackCopy(text, btnElement) {
        try {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.top = "-9999px";
            textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            const successful = document.execCommand('copy');
            document.body.removeChild(textArea);
            if (successful) showCopySuccess(btnElement);
            else prompt("Ctrl+C를 눌러 복사하세요:", text);
        } catch (err) {
            prompt("Ctrl+C를 눌러 복사하세요:", text);
        }
    }

    function showCopySuccess(btnElement) {
        if (!btnElement) return;
        const originalText = btnElement.innerText;
        btnElement.innerText = "✅ 복사 완료!";
        btnElement.classList.add("copied");
        setTimeout(() => {
            btnElement.innerText = originalText;
            btnElement.classList.remove("copied");
        }, 1500);
    }

    window.onload = function() {
        initDataFromExternalJS();
    };
</script>

</body>
</html>
